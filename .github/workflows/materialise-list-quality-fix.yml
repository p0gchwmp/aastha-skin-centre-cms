name: Materialise list quality fix

on:
  push:
    branches:
      - agent/fix-list-quality
    paths:
      - tools/fix_exact_page_list_quality.py
      - .github/workflows/materialise-list-quality-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-list-quality

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Repair exact-page snapshot lists
        run: python tools/fix_exact_page_list_quality.py

      - name: Commit repaired snapshot bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed_data/exact-pages.json.gz.b64
          if git diff --cached --quiet; then
            echo "Snapshot bundle already repaired."
            exit 0
          fi
          git commit -m "Repair malformed exact-page lists"
          git push origin HEAD:agent/fix-list-quality
