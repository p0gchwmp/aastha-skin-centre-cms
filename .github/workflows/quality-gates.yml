name: Lighthouse and accessibility QA

on:
  workflow_dispatch:
  push:
    branches:
      - concept/editorial-production-v37
      - work/editorial-v37-final-qa
    paths:
      - "home/**"
      - "frontend/**"
      - "aastha_cms/**"
      - "seo_support/**"
      - "tools/**"
      - "build.sh"
      - "requirements.txt"
      - "lighthouserc.cjs"
      - ".github/workflows/quality-gates.yml"

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  representative-page-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DJANGO_SETTINGS_MODULE: aastha_cms.settings.quality
      PYTHONUNBUFFERED: "1"
      PUBLIC_SITE_URL: ""
      WAGTAILADMIN_BASE_URL: http://127.0.0.1:8000
      LHCI_BASE_URL: http://127.0.0.1:8000
      SECRET_KEY: quality-gate-only-not-for-production
      AASTHA_EDITORIAL_V37: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install application and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm install --no-save --no-package-lock \
            @lhci/cli@0.15.1 \
            playwright@1.62.0 \
            @axe-core/playwright@4.12.1
          npm --prefix frontend install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node -e "const {chromium}=require('playwright'); console.log('CHROME_PATH='+chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Validate quality-gate sources
        run: |
          node --check tools/audit_accessibility.mjs
          node --check lighthouserc.cjs
          for js in home/static/js/editorial-v37*.js home/static/js/appointment-form-controller.js; do
            if [ -f "$js" ]; then
              node --check "$js"
            fi
          done
          python -m py_compile tools/summarize_lighthouse.py
          python -m py_compile tools/generate_responsive_clinical_images.py
          python -m py_compile tools/audit_clinical_result_images.py
          python manage.py check

      - name: Build production-like local CMS
        run: |
          bash ./build.sh

      - name: Run CMS release evidence audits
        run: |
          mkdir -p audit-artifacts
          python manage.py audit_release --output audit-artifacts/release-audit.json
          python manage.py audit_editorial_v37 --output audit-artifacts/editorial-v37-audit.json
          python manage.py audit_seo_content --output audit-artifacts/seo-content.json
          python tools/audit_clinical_result_images.py --output audit-artifacts/clinical-result-images.json
          python tools/generate_responsive_clinical_images.py --check --output audit-artifacts/responsive-clinical-images.json

      - name: Run rollback-mode Django regression suite
        env:
          AASTHA_EDITORIAL_V37: "0"
        run: |
          python manage.py test home 2>&1 | tee audit-artifacts/django-test.log

      - name: Run editorial-v37 enabled regression contracts
        env:
          AASTHA_EDITORIAL_V37: "1"
        run: |
          python manage.py test home.test_editorial_v37 home.test_staging_robots 2>&1 | tee audit-artifacts/editorial-v37-test.log

      - name: Start compressed local CMS
        run: |
          python -m gunicorn aastha_cms.wsgi:application --bind 127.0.0.1:8000 --workers 1 --timeout 120 --access-logfile - --error-logfile - > audit-artifacts/quality-server.log 2>&1 &
          echo $! > /tmp/quality-server.pid
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/", timeout=2)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("quality server failed to start")
          PY

      - name: Run WCAG accessibility audit
        run: |
          node tools/audit_accessibility.mjs \
            --base-url http://127.0.0.1:8000 \
            --output audit-artifacts/accessibility

      - name: Run mobile Lighthouse gate
        env:
          LHCI_FORM_FACTOR: mobile
        run: |
          npx lhci autorun --config=./lighthouserc.cjs

      - name: Run desktop Lighthouse gate
        if: always()
        env:
          LHCI_FORM_FACTOR: desktop
        run: |
          npx lhci autorun --config=./lighthouserc.cjs

      - name: Publish Lighthouse scorecard
        if: always()
        run: |
          python tools/summarize_lighthouse.py \
            --mobile audit-artifacts/lighthouse-mobile \
            --desktop audit-artifacts/lighthouse-desktop \
            --output audit-artifacts/lighthouse-summary.md
          cat audit-artifacts/lighthouse-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Include local server log
        if: always()
        run: |
          if [ -f audit-artifacts/quality-server.log ]; then
            tail -200 audit-artifacts/quality-server.log >> audit-artifacts/quality-server-tail.log
          fi

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-accessibility-${{ github.sha }}
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 7
