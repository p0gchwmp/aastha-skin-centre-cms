name: Verify exact mobile regressions in production

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-exact-mobile-regressions-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_RELEASE: b49e8c4f82f9877a8bea529a72d34b60f77d483d
      CANONICAL_BASE: https://www.aasthaskincentre.in
      RENDER_BASE: https://aastha-skin-centre-cms.onrender.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install WebKit verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install --with-deps webkit

      - name: Wait for exact release on both live domains
        run: |
          python - <<'PY'
          import os
          import time
          import requests

          expected = os.environ["EXPECTED_RELEASE"]
          urls = (
              os.environ["CANONICAL_BASE"].rstrip("/") + "/healthz/",
              os.environ["RENDER_BASE"].rstrip("/") + "/healthz/",
          )
          deadline = time.time() + 20 * 60
          last = {}
          while time.time() < deadline:
              observed = {}
              for url in urls:
                  try:
                      response = requests.get(url, timeout=30)
                      response.raise_for_status()
                      observed[url] = response.json().get("release", "")
                  except Exception as exc:
                      observed[url] = f"error:{exc}"
              last = observed
              print(observed, flush=True)
              if all(value == expected for value in observed.values()):
                  raise SystemExit(0)
              time.sleep(10)
          raise SystemExit(
              f"Both domains did not reach {expected}; last observed={last!r}"
          )
          PY

      - name: Audit exact reported iPhone regressions on canonical production
        run: |
          python tools/audit_reported_mobile_regressions.py \
            --site "$CANONICAL_BASE" \
            --output audit-artifacts/exact-mobile-production

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-mobile-production-${{ github.sha }}
          path: audit-artifacts/exact-mobile-production/
          if-no-files-found: warn
          retention-days: 14
