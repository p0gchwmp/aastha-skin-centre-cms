{% load wagtailcore_tags %}
<section{% if value.layout.anchor_id %} id="{{ value.layout.anchor_id }}"{% endif %} class="cms-block faq-section article-section cms-theme-{{ value.layout.theme }} cms-width-{{ value.layout.width }} cms-align-{{ value.layout.text_alignment }} cms-space-top-{{ value.layout.top_spacing }} cms-space-bottom-{{ value.layout.bottom_spacing }}{% if value.layout.hide_on_mobile %} cms-hide-mobile{% endif %}{% if value.layout.hide_on_desktop %} cms-hide-desktop{% endif %}">
  <h2>{{ value.heading }}</h2>
  <div class="faq-clean-list">
    {% for item in value.items %}<details{% if value.open_first and forloop.first %} open{% endif %}><summary>{{ item.question }}</summary><div class="faq-answer">{{ item.answer }}</div></details>{% endfor %}
  </div>
</section>
