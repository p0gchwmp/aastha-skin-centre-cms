{% load wagtailcore_tags %}
<section{% if value.layout.anchor_id %} id="{{ value.layout.anchor_id }}"{% endif %} class="cms-block cms-video cms-theme-{{ value.layout.theme }} cms-width-{{ value.layout.width }} cms-align-{{ value.layout.text_alignment }} cms-space-top-{{ value.layout.top_spacing }} cms-space-bottom-{{ value.layout.bottom_spacing }}{% if value.layout.hide_on_mobile %} cms-hide-mobile{% endif %}{% if value.layout.hide_on_desktop %} cms-hide-desktop{% endif %}">
  {% if value.heading %}<h2>{{ value.heading }}</h2>{% endif %}
  <div class="cms-video-frame">{% include_block value.video_url %}</div>
  {% if value.caption %}<p class="cms-caption">{{ value.caption }}</p>{% endif %}
</section>
