{% extends "home/flexible_page.html" %}
{% block og_type %}article{% endblock %}
{% block extra_head %}
{{ block.super }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ page.title|escapejs }}",
  "datePublished": "{{ page.published_date|date:'Y-m-d' }}",
  "dateModified": "{{ page.last_published_at|date:'c' }}",
  "author": {"@type": "Person", "name": "{{ page.author.name|default:'Dr. Cheena Langer'|escapejs }}"},
  "publisher": {"@type": "MedicalClinic", "name": "{{ settings.home.SiteSettings.clinic_name|escapejs }}"}
}
</script>
{% endblock %}
