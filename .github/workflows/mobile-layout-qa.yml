name: Mobile layout QA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DJANGO_SETTINGS_MODULE: aastha_cms.settings.dev
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application, Chromium and WebKit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit

      - name: Check mobile audit source
        run: |
          python -m py_compile tools/audit_mobile_layout.py
          python -m py_compile tools/audit_reported_mobile_regressions.py
          python -m py_compile tools/generate_responsive_clinical_images.py

      - name: Build and start local CMS
        run: |
          rm -f db.sqlite3
          python tools/generate_responsive_clinical_images.py
          python tools/audit_clinical_result_images.py
          python manage.py migrate --no-input
          python manage.py initialize_cms
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/aastha-mobile.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/healthz/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/aastha-mobile.log
          exit 1

      - name: Audit every page in Chromium light mode
        run: |
          python tools/audit_mobile_layout.py \
            --site http://127.0.0.1:8000 \
            --engine chromium \
            --color-scheme light \
            --output audit-artifacts/mobile-layout-local-chromium

      - name: Audit every page as iPhone WebKit in dark mode
        run: |
          python tools/audit_mobile_layout.py \
            --site http://127.0.0.1:8000 \
            --engine webkit \
            --color-scheme dark \
            --output audit-artifacts/mobile-layout-local-webkit

      - name: Audit exact reported iPhone regressions
        run: |
          python tools/audit_reported_mobile_regressions.py \
            --site http://127.0.0.1:8000 \
            --output audit-artifacts/reported-mobile-regressions-local

      - name: Upload mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-local-${{ github.sha }}
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 14

  live-mobile-layout:
    needs: local-mobile-layout
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Chromium and WebKit audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit

      - name: Wait for this release on Render
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          sleep 90
          for attempt in $(seq 1 120); do
            body="$(curl --fail --silent https://www.aasthaskincentre.in/healthz/ || true)"
            if printf '%s' "$body" | grep -q "$EXPECTED_RELEASE"; then
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 5
          done
          printf 'Expected release %s did not become live.\n' "$EXPECTED_RELEASE"
          exit 1

      - name: Audit canonical website in Chromium light mode
        run: |
          python tools/audit_mobile_layout.py \
            --site https://www.aasthaskincentre.in \
            --engine chromium \
            --color-scheme light \
            --output audit-artifacts/mobile-layout-live-chromium

      - name: Audit canonical website as iPhone WebKit in dark mode
        run: |
          python tools/audit_mobile_layout.py \
            --site https://www.aasthaskincentre.in \
            --engine webkit \
            --color-scheme dark \
            --output audit-artifacts/mobile-layout-live-webkit

      - name: Audit exact reported production regressions
        run: |
          python tools/audit_reported_mobile_regressions.py \
            --site https://www.aasthaskincentre.in \
            --output audit-artifacts/reported-mobile-regressions-live

      - name: Upload live mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-live-${{ github.sha }}
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 14
