name: Verify live premium icons

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-premium-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install browser audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml pillow playwright
          python -m playwright install --with-deps chromium

      - name: Wait for merged release on Render
        env:
          EXPECTED_RELEASE: c996659168c457ba712d7c2da363ca3e1ff4e7d5
        run: |
          for attempt in $(seq 1 150); do
            body="$(curl --fail --silent https://www.aasthaskincentre.in/healthz/ || true)"
            if printf '%s' "$body" | grep -q "$EXPECTED_RELEASE"; then
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 5
          done
          printf 'Expected release %s did not become live.\n' "$EXPECTED_RELEASE"
          exit 1

      - name: Confirm premium homepage assets are public
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          homepage_url = "https://www.aasthaskincentre.in/"
          response = requests.get(homepage_url, timeout=30)
          response.raise_for_status()
          soup = BeautifulSoup(response.text, "lxml")
          stylesheet = next(
              (
                  link.get("href")
                  for link in soup.select('link[rel="stylesheet"][href]')
                  if "premium-icons" in link.get("href", "")
              ),
              None,
          )
          if not stylesheet:
              raise SystemExit("Premium icon stylesheet link was not found.")

          css_url = urljoin(homepage_url, stylesheet)
          css_response = requests.get(css_url, timeout=30)
          css_response.raise_for_status()
          css = css_response.text

          for asset in ("acne-care", "pigmentation-care", "hair-care"):
              match = re.search(
                  rf'url\(["\']?([^"\')]*{asset}[^"\')]*\.svg)["\']?\)',
                  css,
              )
              if not match:
                  raise SystemExit(f"{asset} asset reference was not found in {css_url}")
              asset_url = urljoin(css_url, match.group(1))
              asset_response = requests.get(asset_url, timeout=30)
              asset_response.raise_for_status()
              if "<svg" not in asset_response.text[:500]:
                  raise SystemExit(f"{asset_url} did not return SVG markup")
              print(asset_url)
          PY

      - name: Audit live phone layouts
        run: |
          python tools/audit_mobile_layout.py \
            --site https://www.aasthaskincentre.in \
            --output audit-artifacts/live-premium-icons-mobile

      - name: Audit live dark-mode readability
        run: |
          python tools/audit_dark_mode_readability.py \
            --cms https://www.aasthaskincentre.in \
            --output audit-artifacts/live-premium-icons-dark

      - name: Audit live performance budgets
        run: |
          python tools/audit_frontend_performance.py \
            --cms https://www.aasthaskincentre.in \
            --output audit-artifacts/live-premium-icons-performance

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-premium-icons-${{ github.sha }}
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 14
