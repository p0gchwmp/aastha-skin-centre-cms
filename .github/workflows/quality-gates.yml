name: Lighthouse and accessibility QA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  representative-page-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DJANGO_SETTINGS_MODULE: aastha_cms.settings.quality
      PYTHONUNBUFFERED: "1"
      PUBLIC_SITE_URL: http://127.0.0.1:8000
      WAGTAILADMIN_BASE_URL: http://127.0.0.1:8000
      LHCI_BASE_URL: http://127.0.0.1:8000
      SECRET_KEY: quality-gate-only-not-for-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install application and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm install --no-save --no-package-lock \
            @lhci/cli@0.15.1 \
            playwright@1.62.0 \
            @axe-core/playwright@4.12.1
          npx playwright install --with-deps chromium
          node -e "const {chromium}=require('playwright'); console.log('CHROME_PATH='+chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Validate quality-gate sources
        run: |
          node --check tools/audit_accessibility.mjs
          node --check lighthouserc.cjs
          python -m py_compile tools/summarize_lighthouse.py
          python -m py_compile tools/generate_responsive_clinical_images.py
          python -m py_compile tools/audit_clinical_result_images.py
          python manage.py check

      - name: Build production-like local CMS
        run: |
          rm -f db.sqlite3
          rm -rf staticfiles
          python tools/build_visual_cue_assets.py
          python tools/install_curated_visual_cue_assets.py
          python tools/generate_responsive_clinical_images.py
          python tools/audit_clinical_result_images.py
          python tools/verify_exact_page_snapshots.py
          python manage.py collectstatic --no-input
          python manage.py migrate --no-input
          python manage.py initialize_cms

      - name: Start compressed local CMS
        run: |
          nohup gunicorn aastha_cms.wsgi:application \
            --bind 127.0.0.1:8000 \
            --workers 2 \
            --access-logfile - \
            --error-logfile - \
            > /tmp/aastha-quality.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/healthz/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/aastha-quality.log
          exit 1

      - name: Run WCAG accessibility audit
        run: |
          node tools/audit_accessibility.mjs \
            --base-url http://127.0.0.1:8000 \
            --output audit-artifacts/accessibility
          cat audit-artifacts/accessibility/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run mobile Lighthouse gate
        env:
          LHCI_FORM_FACTOR: mobile
        run: npx lhci autorun --config=lighthouserc.cjs

      - name: Run desktop Lighthouse gate
        if: always()
        env:
          LHCI_FORM_FACTOR: desktop
        run: npx lhci autorun --config=lighthouserc.cjs

      - name: Publish Lighthouse scorecard
        if: always()
        run: |
          python tools/summarize_lighthouse.py \
            --root audit-artifacts \
            --output audit-artifacts/lighthouse-summary.md
          cat audit-artifacts/lighthouse-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Include local server log
        if: always()
        run: cp /tmp/aastha-quality.log audit-artifacts/quality-server.log || true

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-accessibility-${{ github.sha }}
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 30
