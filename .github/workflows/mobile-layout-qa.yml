name: Mobile layout QA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DJANGO_SETTINGS_MODULE: aastha_cms.settings.dev
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check mobile audit source
        run: python -m py_compile tools/audit_mobile_layout.py

      - name: Build and start local CMS
        run: |
          rm -f db.sqlite3
          python manage.py migrate --no-input
          python manage.py initialize_cms
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/aastha-mobile.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/healthz/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/aastha-mobile.log
          exit 1

      - name: Audit every page at phone width
        run: |
          python tools/audit_mobile_layout.py \
            --site http://127.0.0.1:8000 \
            --output audit-artifacts/mobile-layout-local

      - name: Upload mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-local-${{ github.sha }}
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 14

  live-mobile-layout:
    if: github.event_name != 'pull_request'
    needs: local-mobile-layout
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Chromium audit dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wait for this release on Render
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          sleep 90
          for attempt in $(seq 1 120); do
            body="$(curl --fail --silent https://www.aasthaskincentre.in/healthz/ || true)"
            if printf '%s' "$body" | grep -q "$EXPECTED_RELEASE"; then
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 5
          done
          printf 'Expected release %s did not become live.\n' "$EXPECTED_RELEASE"
          exit 1

      - name: Audit canonical website at phone width
        run: |
          python tools/audit_mobile_layout.py \
            --site https://www.aasthaskincentre.in \
            --output audit-artifacts/mobile-layout-live

      - name: Upload live mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-live-${{ github.sha }}
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 14
