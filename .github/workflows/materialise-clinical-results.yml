name: Materialise clinical result images

on:
  push:
    branches:
      - agent/add-drive-clinical-galleries
    paths:
      - .github/workflows/materialise-clinical-results.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-drive-clinical-galleries

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install image dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow

      - name: Download and optimize approved Drive images
        run: python tools/materialise_clinical_result_images.py

      - name: Commit local WebP assets to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home/static/images/clinical-results/
          if git diff --cached --quiet; then
            echo "Clinical result assets are already materialised."
            exit 0
          fi
          git commit -m "Materialise approved clinical result images"
          git push origin HEAD:agent/add-drive-clinical-galleries
