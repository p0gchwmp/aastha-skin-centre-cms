name: Diagnose exact mobile regressions

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diagnose_exact_mobile_regressions.py"
      - ".github/workflows/diagnose-exact-mobile-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-live-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Playwright WebKit
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps webkit

      - name: Diagnose exact reported components
        run: |
          python tools/diagnose_exact_mobile_regressions.py \
            --base https://www.aasthaskincentre.in \
            --output audit-artifacts/exact-mobile-diagnostic

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-mobile-diagnostic-${{ github.sha }}
          path: audit-artifacts/exact-mobile-diagnostic/
          if-no-files-found: error
          retention-days: 14
