{% load wagtailimages_tags %}
<section{% if value.layout.anchor_id %} id="{{ value.layout.anchor_id }}"{% endif %} class="cms-block cms-comparison-section cms-theme-{{ value.layout.theme }} cms-width-{{ value.layout.width }} cms-align-{{ value.layout.text_alignment }} cms-space-top-{{ value.layout.top_spacing }} cms-space-bottom-{{ value.layout.bottom_spacing }}{% if value.layout.hide_on_mobile %} cms-hide-mobile{% endif %}{% if value.layout.hide_on_desktop %} cms-hide-desktop{% endif %}" data-luxury-comparison>
  {% if value.heading %}<h2>{{ value.heading }}</h2>{% endif %}
  {% if value.introduction %}<p class="lead">{{ value.introduction }}</p>{% endif %}
  <div class="cms-comparison-grid" role="group" aria-label="{{ value.heading|default:'Before and after image comparison' }}" data-first-label="{{ value.first_label }}" data-second-label="{{ value.second_label }}">
    <figure data-comparison-side="first">{% image value.first_image fill-900x700-c100 alt=value.first_alt_text loading="lazy" decoding="async" %}<figcaption>{{ value.first_label }}</figcaption></figure>
    <figure data-comparison-side="second">{% image value.second_image fill-900x700-c100 alt=value.second_alt_text loading="lazy" decoding="async" %}<figcaption>{{ value.second_label }}</figcaption></figure>
  </div>
  {% if value.note %}<p class="medical-disclaimer">{{ value.note }}</p>{% endif %}
</section>
