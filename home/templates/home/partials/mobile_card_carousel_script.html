<script id="mobile-card-carousel-script">
(() => {
  const MOBILE_QUERY = window.matchMedia('(max-width: 700px)');
  const TARGET_SELECTORS = [
    '.concern-grid',
    '.treatment-grid',
    '.why-grid',
    '.journal-grid',
    '.article-grid',
    '.guide-grid',
    '.care-path-grid',
    '.value-grid'
  ];
  const EXCLUDED_ANCESTOR = [
    '.treatment-directory',
    '.hub-category',
    '.hub-category-grid',
    '.condition-directory',
    '.directory-grid',
    '.clinic-choice-grid',
    '.process-grid',
    '[data-no-carousel]'
  ].join(',');
  const instances = [];

  const directSlides = track => Array.from(track.children).filter(child => (
    !child.matches('script, template, style, .card-carousel-controls')
  ));

  const nearestHeading = track => {
    const section = track.closest('section, main, article, .home-section, .section');
    const heading = section?.querySelector('h2, h3, h1');
    return (heading?.textContent || 'Cards').trim().replace(/\s+/g, ' ');
  };

  const createButton = (direction, label) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'card-carousel-button';
    button.dataset.carouselDirection = direction;
    button.setAttribute('aria-label', label);
    const arrow = document.createElement('span');
    arrow.setAttribute('aria-hidden', 'true');
    arrow.textContent = direction === 'previous' ? '←' : '→';
    button.appendChild(arrow);
    return button;
  };

  class MobileCardCarousel {
    constructor(track, sequence) {
      this.track = track;
      this.slides = directSlides(track);
      this.index = 0;
      this.active = false;
      this.pointerStart = null;
      this.originalTabindex = track.getAttribute('tabindex');
      this.label = nearestHeading(track);
      this.id = `mobile-card-carousel-${sequence}`;
      this.previous = createButton('previous', `Previous ${this.label} card`);
      this.next = createButton('next', `Next ${this.label} card`);
      this.current = document.createElement('span');
      this.total = document.createElement('span');
      this.total.textContent = String(this.slides.length);

      const status = document.createElement('p');
      status.className = 'card-carousel-status';
      status.setAttribute('aria-live', 'polite');
      status.setAttribute('aria-atomic', 'true');
      status.append(this.current, document.createTextNode(' of '), this.total);

      const hint = document.createElement('p');
      hint.className = 'card-carousel-hint';
      hint.textContent = 'Swipe or use the arrows';

      const meta = document.createElement('div');
      meta.className = 'card-carousel-meta';
      meta.append(status, hint);

      this.controls = document.createElement('nav');
      this.controls.className = 'card-carousel-controls';
      this.controls.id = `${this.id}-controls`;
      this.controls.hidden = true;
      this.controls.setAttribute('aria-label', `${this.label} carousel controls`);
      this.controls.append(this.previous, meta, this.next);
      this.track.insertAdjacentElement('afterend', this.controls);

      this.previous.addEventListener('click', () => this.show(this.index - 1));
      this.next.addEventListener('click', () => this.show(this.index + 1));
      this.track.addEventListener('keydown', event => this.onKeydown(event));
      this.track.addEventListener('pointerdown', event => this.onPointerDown(event));
      this.track.addEventListener('pointerup', event => this.onPointerUp(event));
      this.track.addEventListener('pointercancel', () => { this.pointerStart = null; });
      this.syncMode();
    }

    activate() {
      if (this.active) return;
      this.active = true;
      this.track.dataset.mobileCardCarousel = 'true';
      this.track.classList.add('mobile-card-carousel');
      this.track.id ||= this.id;
      this.track.setAttribute('role', 'region');
      this.track.setAttribute('aria-roledescription', 'carousel');
      this.track.setAttribute('aria-label', this.label);
      this.track.setAttribute('aria-describedby', this.controls.id);
      this.track.setAttribute('tabindex', '0');
      this.controls.hidden = false;
      this.show(Math.min(this.index, this.slides.length - 1), false);
    }

    deactivate() {
      if (!this.active) return;
      this.active = false;
      delete this.track.dataset.mobileCardCarousel;
      this.track.classList.remove('mobile-card-carousel');
      this.track.removeAttribute('role');
      this.track.removeAttribute('aria-roledescription');
      this.track.removeAttribute('aria-label');
      this.track.removeAttribute('aria-describedby');
      if (this.originalTabindex === null) {
        this.track.removeAttribute('tabindex');
      } else {
        this.track.setAttribute('tabindex', this.originalTabindex);
      }
      this.controls.hidden = true;
      this.slides.forEach(slide => {
        slide.hidden = false;
        slide.classList.remove('card-carousel-slide--active');
        slide.removeAttribute('aria-hidden');
      });
    }

    syncMode() {
      if (MOBILE_QUERY.matches) this.activate();
      else this.deactivate();
    }

    show(nextIndex, announce = true) {
      if (!this.active) return;
      const bounded = Math.max(0, Math.min(nextIndex, this.slides.length - 1));
      this.index = bounded;
      this.slides.forEach((slide, slideIndex) => {
        const selected = slideIndex === bounded;
        slide.hidden = !selected;
        slide.classList.toggle('card-carousel-slide--active', selected);
        slide.setAttribute('aria-hidden', selected ? 'false' : 'true');
      });
      this.current.textContent = String(bounded + 1);
      this.previous.disabled = bounded === 0;
      this.next.disabled = bounded === this.slides.length - 1;
      if (announce) {
        this.track.dispatchEvent(new CustomEvent('cardcarouselchange', {
          bubbles: true,
          detail: { index: bounded, total: this.slides.length }
        }));
      }
    }

    onKeydown(event) {
      if (!this.active) return;
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        this.show(this.index - 1);
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        this.show(this.index + 1);
      } else if (event.key === 'Home') {
        event.preventDefault();
        this.show(0);
      } else if (event.key === 'End') {
        event.preventDefault();
        this.show(this.slides.length - 1);
      }
    }

    onPointerDown(event) {
      if (!this.active || event.pointerType === 'mouse') return;
      this.pointerStart = { x: event.clientX, y: event.clientY };
    }

    onPointerUp(event) {
      if (!this.active || !this.pointerStart || event.pointerType === 'mouse') return;
      const deltaX = event.clientX - this.pointerStart.x;
      const deltaY = event.clientY - this.pointerStart.y;
      this.pointerStart = null;
      if (Math.abs(deltaX) < 42 || Math.abs(deltaX) <= Math.abs(deltaY)) return;
      this.show(deltaX < 0 ? this.index + 1 : this.index - 1);
    }
  }

  const install = () => {
    const seen = new Set();
    document.querySelectorAll(TARGET_SELECTORS.join(',')).forEach(track => {
      if (seen.has(track) || track.closest(EXCLUDED_ANCESTOR)) return;
      seen.add(track);
      const slides = directSlides(track);
      if (slides.length < 3 || slides.length > 12) return;
      instances.push(new MobileCardCarousel(track, instances.length + 1));
    });
    const sync = () => instances.forEach(instance => instance.syncMode());
    if (typeof MOBILE_QUERY.addEventListener === 'function') {
      MOBILE_QUERY.addEventListener('change', sync);
    } else {
      MOBILE_QUERY.addListener(sync);
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', install, { once: true });
  } else {
    install();
  }
})();
</script>
