{% load wagtailcore_tags %}
<section{% if value.layout.anchor_id %} id="{{ value.layout.anchor_id }}"{% endif %} class="cms-block article-section cms-related-pages cms-theme-{{ value.layout.theme }} cms-width-{{ value.layout.width }} cms-align-{{ value.layout.text_alignment }} cms-space-top-{{ value.layout.top_spacing }} cms-space-bottom-{{ value.layout.bottom_spacing }}{% if value.layout.hide_on_mobile %} cms-hide-mobile{% endif %}{% if value.layout.hide_on_desktop %} cms-hide-desktop{% endif %}">
  <h2>{{ value.heading }}</h2>
  <nav class="related-care-links" aria-label="{{ value.heading }}">{% for related in value.pages %}<a href="{% pageurl related %}">{{ related.title }}</a>{% endfor %}</nav>
</section>
