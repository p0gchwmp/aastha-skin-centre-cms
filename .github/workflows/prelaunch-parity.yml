name: Prelaunch parity QA

on:
  pull_request:
    paths:
      - ".github/qa/run-parity"
      - ".github/workflows/prelaunch-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prelaunch-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-branch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DJANGO_SETTINGS_MODULE: aastha_cms.settings.dev
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application and audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install requests beautifulsoup4 lxml pillow playwright
          python -m playwright install --with-deps chromium

      - name: Run build-time and Django checks
        run: |
          python tools/verify_exact_page_snapshots.py
          python tools/audit_content_list_quality.py
          bash -n tools/create_portable_database_backup.sh
          bash -n tools/create_media_backup.sh
          python -m py_compile tools/audit_domain_cutover.py
          python -m py_compile tools/audit_seo_foundation.py
          python -m py_compile tools/generate_responsive_clinical_images.py
          python -m py_compile tools/audit_clinical_result_images.py
          python -m py_compile tools/audit_clinical_result_galleries_browser.py
          python -m py_compile tools/audit_deployed_sites_with_extensions.py
          python -m py_compile tools/audit_browser_parity_brand_normalized.py
          python -m py_compile tools/audit_content_rhythm.py
          python tools/generate_responsive_clinical_images.py
          python tools/audit_clinical_result_images.py
          python manage.py makemigrations --check --dry-run
          python manage.py check
          python manage.py test

      - name: Build local CMS database
        run: |
          rm -f db.sqlite3
          python manage.py migrate --no-input
          python manage.py initialize_cms
          python manage.py check_launch_config
          python manage.py audit_seo_content \
            --json audit-artifacts/local-seo-content.json

      - name: Start local CMS
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/aastha-local.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/healthz/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/aastha-local.log
          exit 1

      - name: Compare every legacy route with static reference
        run: |
          python tools/audit_deployed_sites_with_extensions.py \
            --cms http://127.0.0.1:8000 \
            --static https://aastha-skin-centre-staging.onrender.com \
            --output audit-artifacts/local-structure

      - name: Run desktop, mobile and interaction audit
        run: |
          python tools/audit_browser_parity_brand_normalized.py \
            --cms http://127.0.0.1:8000 \
            --static https://aastha-skin-centre-staging.onrender.com \
            --output audit-artifacts/local-browser

      - name: Exercise every clinical gallery and carousel
        run: |
          python tools/audit_clinical_result_galleries_browser.py \
            --cms http://127.0.0.1:8000 \
            --output audit-artifacts/local-clinical-gallery-browser

      - name: Audit dark-mode readability
        run: |
          python tools/audit_dark_mode_readability.py \
            --cms http://127.0.0.1:8000 \
            --output audit-artifacts/local-dark-readability

      - name: Audit editorial content rhythm
        run: |
          python tools/audit_content_rhythm.py \
            --cms http://127.0.0.1:8000 \
            --output audit-artifacts/local-content-rhythm

      - name: Audit frontend performance budgets
        run: |
          python tools/audit_frontend_performance.py \
            --cms http://127.0.0.1:8000 \
            --output audit-artifacts/local-performance

      - name: Include local server log
        if: always()
        run: cp /tmp/aastha-local.log audit-artifacts/local-server.log || true

      - name: Upload local parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-parity-${{ github.sha }}
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 14

  deployed-render-audit:
    if: github.event_name != 'pull_request'
    needs: local-branch-audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml pillow playwright
          python -m playwright install --with-deps chromium

      - name: Wait for Render deployment to become available
        run: |
          sleep 120
          for attempt in $(seq 1 90); do
            if curl --fail --silent https://aastha-skin-centre-cms.onrender.com/healthz/ > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Compare deployed sites across every legacy route
        run: |
          python tools/audit_deployed_sites_with_extensions.py \
            --cms https://aastha-skin-centre-cms.onrender.com \
            --static https://aastha-skin-centre-staging.onrender.com \
            --output audit-artifacts/deployed-structure

      - name: Run deployed desktop, mobile and interaction audit
        run: |
          python tools/audit_browser_parity_brand_normalized.py \
            --cms https://aastha-skin-centre-cms.onrender.com \
            --static https://aastha-skin-centre-staging.onrender.com \
            --output audit-artifacts/deployed-browser

      - name: Exercise deployed clinical galleries and carousels
        run: |
          python tools/audit_clinical_result_galleries_browser.py \
            --cms https://aastha-skin-centre-cms.onrender.com \
            --output audit-artifacts/deployed-clinical-gallery-browser

      - name: Audit deployed dark-mode readability
        run: |
          python tools/audit_dark_mode_readability.py \
            --cms https://aastha-skin-centre-cms.onrender.com \
            --output audit-artifacts/deployed-dark-readability

      - name: Audit deployed editorial content rhythm
        run: |
          python tools/audit_content_rhythm.py \
            --cms https://aastha-skin-centre-cms.onrender.com \
            --output audit-artifacts/deployed-content-rhythm

      - name: Audit deployed frontend performance budgets
        run: |
          python tools/audit_frontend_performance.py \
            --cms https://aastha-skin-centre-cms.onrender.com \
            --output audit-artifacts/deployed-performance

      - name: Upload deployed parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-parity-${{ github.sha }}
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 14
