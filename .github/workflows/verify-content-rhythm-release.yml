name: Verify content rhythm release

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_RELEASE: 963c56b8368d20fc37c62820f6e797ea08890c8b
      CANONICAL_BASE: https://www.aasthaskincentre.in
      RENDER_BASE: https://aastha-skin-centre-cms.onrender.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml pillow playwright
          python -m playwright install --with-deps chromium

      - name: Wait for exact release on both live domains
        run: |
          python - <<'PY'
          import os
          import time
          import requests

          expected = os.environ["EXPECTED_RELEASE"]
          urls = [
              os.environ["CANONICAL_BASE"] + "/healthz/",
              os.environ["RENDER_BASE"] + "/healthz/",
          ]
          deadline = time.time() + 15 * 60
          last = {}
          while time.time() < deadline:
              releases = {}
              for url in urls:
                  try:
                      response = requests.get(url, timeout=30)
                      response.raise_for_status()
                      releases[url] = response.json().get("release", "")
                  except Exception as exc:
                      releases[url] = f"error:{exc}"
              last = releases
              print(releases, flush=True)
              if all(value == expected for value in releases.values()):
                  raise SystemExit(0)
              time.sleep(10)
          raise SystemExit(
              f"Production did not reach {expected}; last observed={last!r}"
          )
          PY

      - name: Verify final style delivery
        run: |
          mkdir -p audit-artifacts/content-rhythm-release
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import requests

          base = os.environ["CANONICAL_BASE"].rstrip("/")
          routes = (
              "/",
              "/treatments/fungal-infection-treatment/",
              "/treatments/laser-hair-reduction/",
              "/book-appointment/",
          )
          checks = []
          for route in routes:
              response = requests.get(base + route, timeout=30)
              source = response.text
              checks.append({
                  "route": route,
                  "status": response.status_code,
                  "inline_rhythm": "Editorial content rhythm" in source,
                  "no_extra_stylesheet": "content-rhythm.css" not in source,
              })
          failed = [
              check for check in checks
              if check["status"] != 200
              or not check["inline_rhythm"]
              or not check["no_extra_stylesheet"]
          ]
          Path("audit-artifacts/content-rhythm-release/source-delivery.json").write_text(
              json.dumps({"checks": checks}, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(checks, indent=2))
          if failed:
              raise SystemExit(f"Style delivery checks failed: {failed!r}")
          PY

      - name: Audit live list rhythm and dark FAQ
        run: |
          python tools/audit_content_rhythm.py \
            --cms "$CANONICAL_BASE" \
            --output audit-artifacts/content-rhythm-release/browser

      - name: Verify live frontend budget
        run: |
          python tools/audit_frontend_performance.py \
            --cms "$CANONICAL_BASE" \
            --output audit-artifacts/content-rhythm-release/performance

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-rhythm-release-${{ github.sha }}
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 14
