name: Mobile layout QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Chromium audit dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wait for verified release on Render
        env:
          EXPECTED_RELEASE: b5c78664e24313a8509099edcf3064845d0f5d79
        run: |
          for attempt in $(seq 1 120); do
            body="$(curl --fail --silent https://www.aasthaskincentre.in/healthz/ || true)"
            if printf '%s' "$body" | grep -q "$EXPECTED_RELEASE"; then
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 5
          done
          printf 'Expected release %s did not become live.\n' "$EXPECTED_RELEASE"
          exit 1

      - name: Audit canonical website at phone width
        run: |
          python tools/audit_mobile_layout.py \
            --site https://www.aasthaskincentre.in \
            --output audit-artifacts/mobile-layout-live

      - name: Upload live mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-live-${{ github.sha }}
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 14
