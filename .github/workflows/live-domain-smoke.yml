name: Live domain smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: live-domain-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-domain-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml

      - name: Wait for canonical domain
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent https://www.aasthaskincentre.in/healthz/ > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify canonical and Render release parity
        run: |
          canonical_release="$(python - <<'PY'
          import requests
          payload = requests.get(
              "https://www.aasthaskincentre.in/healthz/", timeout=30
          ).json()
          if payload.get("status") != "ok" or not payload.get("release"):
              raise SystemExit(f"Invalid canonical health payload: {payload!r}")
          print(payload["release"])
          PY
          )"

          render_release="$(python - <<'PY'
          import requests
          payload = requests.get(
              "https://aastha-skin-centre-cms.onrender.com/healthz/", timeout=30
          ).json()
          if payload.get("status") != "ok" or not payload.get("release"):
              raise SystemExit(f"Invalid Render health payload: {payload!r}")
          print(payload["release"])
          PY
          )"

          echo "Canonical release: $canonical_release"
          echo "Render release:    $render_release"
          test "$canonical_release" = "$render_release"

          python tools/audit_domain_cutover.py \
            --canonical https://www.aasthaskincentre.in \
            --alternate https://aasthaskincentre.in \
            --render https://aastha-skin-centre-cms.onrender.com \
            --expected-release "$canonical_release" \
            --output audit-artifacts/live-domain

      - name: Upload live-domain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-domain-smoke-${{ github.sha }}
          path: audit-artifacts/live-domain/
          if-no-files-found: warn
          retention-days: 14
