name: Purge stored Actions artifacts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/purge-actions-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete all stored workflow artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            core.info(`Found ${artifacts.length} stored artifacts to delete.`);

            let deleted = 0;
            for (const artifact of artifacts) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
              deleted += 1;
              if (deleted % 100 === 0) {
                core.info(`Deleted ${deleted}/${artifacts.length} artifacts.`);
              }
            }

            core.info(`Deleted ${deleted} stored artifacts.`);
