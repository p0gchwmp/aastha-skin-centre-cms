name: Manus staging QA

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Staging origin to review
        required: true
        default: https://aastha-editorial-cms-staging.onrender.com
      profile:
        description: Manus agent profile
        required: true
        default: standard
        type: choice
        options:
          - lite
          - standard
          - max

permissions:
  contents: read

concurrency:
  group: manus-staging-qa
  cancel-in-progress: true

jobs:
  manus-read-only-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Manus QA source
        run: python -m py_compile tools/manus_qa.py

      - name: Run read-only Manus staging review
        run: |
          python tools/manus_qa.py \
            --base-url "${{ inputs.base_url }}" \
            --profile "${{ inputs.profile }}" \
            --wait \
            --timeout-seconds 900 \
            --output audit-artifacts/manus-qa.json

      - name: Publish QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manus-staging-qa-${{ github.sha }}
          path: audit-artifacts/manus-qa.json
          if-no-files-found: warn
          retention-days: 3
